# Generated by honey-clients release sync from release.config.ts; the next sync overwrites any edit.
# Publishes the tag sync pushes (or the one given to a manual run) to: pypi.
name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to publish again, as vX.Y.Z
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        shell: bash
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: the tag is the version the package publishes
        run: |
          VERSION="${TAG#v}"
          FOUND="$(jq -er '.packages[] | select(.registry == "pypi") | .version' .honey-generated.json)"
          [ "$FOUND" = "$VERSION" ] || { echo "::error::tag $TAG, but .honey-generated.json holds version $FOUND"; exit 1; }
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: build
        run: |
          python -m pip install build==1.6.1
          python -m build
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
      - name: pypi serves the version
        run: |
          NAME="$(jq -er '.packages[] | select(.registry == "pypi") | .name' .honey-generated.json)"
          for _ in $(seq "${LIVE_CHECK_TRIES:-60}"); do
            if curl -fsS -o /dev/null "https://pypi.org/pypi/$NAME/$VERSION/json"; then echo "pypi serves $NAME $VERSION"; exit 0; fi
            sleep 10
          done
          echo "::error::pypi does not serve $NAME $VERSION; the publish above did not land"
          exit 1
